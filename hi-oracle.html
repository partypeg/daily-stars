  var speech = document.getElementById("speech");
  var choices = document.getElementById("choices");
  var orb = document.getElementById("orb");
  var timer = null, chars = [], pos = 0, doneCb = null;
  var state = { sign: 0, topic: "", qi: 0, ans: [] };

  function splitText(text) {
    if (window.Intl && Intl.Segmenter) {
      try {
        return Array.from(new Intl.Segmenter("hi", { granularity: "grapheme" }).segment(text), function (x) { return x.segment; });
      } catch (e) {}
    }
    return Array.from(text);
  }

  function say(text, cb) {
    clearInterval(timer);
    chars = splitText(text); pos = 0; doneCb = cb || null;
    choices.innerHTML = ""; choices.className = "";
    orb.className = "speaking";
    speech.textContent = "";
    timer = setInterval(function () {
      pos++;
      speech.textContent = chars.slice(0, pos).join("");
      if (pos >= chars.length) finish();
    }, 24);
  }
  function finish() {
    clearInterval(timer);
    pos = chars.length;
    speech.textContent = chars.join("");
    orb.className = "";
    if (doneCb) { var f = doneCb; doneCb = null; f(); }
  }
  function skip() { if (doneCb) finish(); }
  orb.onclick = skip;
  speech.onclick = skip;

  function buttons(list, cls) {
    choices.innerHTML = "";
    choices.className = cls || "";
    list.forEach(function (b) {
      var el = document.createElement("button");
      el.className = "btn";
      el.textContent = b[0];
      el.onclick = b[1];
      choices.appendChild(el);
    });
  }

  function start() {
    say("सितारों का ओरेकल आपका स्वागत करता है। अपनी राशि बताइए, और आपका दिन पढ़ा जाएगा।", function () {
      buttons(signs.map(function (s, i) {
        return [s[0] + " " + s[1], function () { pickSign(i); }];
      }), "signs");
    });
  }

  function pickSign(i) {
    state.sign = i;
    var today = new Date();
    var begin = new Date(today.getFullYear(), 0, 0);
    var d = Math.floor((today - begin) / 86400000);
    var text = signs[i][1] + " राशि, यह रहा आपका आज का राशिफल।\n\n" +
      "प्रेम: " + love[(d + i * 5) % love.length] + "\n\n" +
      "काम: " + work[(d * 2 + i * 7) % work.length] + "\n\n" +
      "मन: " + mood[(d * 3 + i * 3) % mood.length];
    say(text, function () {
      buttons([
        ["✨ अपनी स्थिति के बारे में सितारों से पूछें", chooseTopic],
        ["दूसरी राशि चुनें", start]
      ]);
    });
  }

  function chooseTopic() {
    say("आपके मन में क्या चल रहा है? कुछ सवालों के जवाब हाँ या नहीं में दीजिए, और सितारे बताएँगे कि वे क्या देख रहे हैं।", function () {
      var list = Object.keys(topics).map(function (k) {
        return [topics[k].label, function () { askTopic(k); }];
      });
      list.push(["वापस", function () { pickSign(state.sign); }]);
      buttons(list);
    });
  }

  function askTopic(key) {
    state.topic = key; state.qi = 0; state.ans = [];
    nextQ();
  }

  function nextQ() {
    var t = topics[state.topic];
    if (state.qi >= t.qs.length) { giveReading(); return; }
    var q = t.qs[state.qi];
    say(q[0], function () {
      buttons([
        ["हाँ", function () { state.ans.push(q[1]); state.qi++; nextQ(); }],
        ["नहीं", function () { state.ans.push(q[2]); state.qi++; nextQ(); }]
      ], "yn");
    });
  }

  function giveReading() {
    var t = topics[state.topic];
    var text = "सितारों ने आपकी बात सुन ली।\n\n" +
      state.ans.join(" ") + "\n\n" +
      elementLine[signs[state.sign][2]] + "\n\n" +
      t.closing;
    say(text, function () {
      buttons([
        ["किसी और बारे में पूछें", chooseTopic],
        ["नई राशि सुनें", start]
      ]);
    });
  }

  // drifting stars
  for (var n = 0; n < 22; n++) {
    var s = document.createElement("div");
    var size = 2 + Math.random() * 4;
    s.className = "star";
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (18 + Math.random() * 30) + "s, " + (3 + Math.random() * 5) + "s";
    s.style.animationDelay = (-Math.random() * 40) + "s, " + (-Math.random() * 6) + "s";
    document.body.appendChild(s);
  }

  start();
</script>
</body>
</html>
