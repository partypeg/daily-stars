<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Stars</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0033, #3d0a6b, #0a1a4d, #3d0a6b, #1a0033);
    background-size: 400% 400%;
    animation: drift 24s ease-in-out infinite;
    color: #f3e8ff;
    font-family: Georgia, serif;
    text-align: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .star {
    position: fixed;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px #c77dff;
    pointer-events: none;
    z-index: 0;
    animation: float linear infinite, twinkle ease-in-out infinite;
  }
  @keyframes float {
    from { transform: translateY(105vh); }
    to   { transform: translateY(-10vh); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 0.9; }
  }

  h1, p, .grid, #result, .note { position: relative; z-index: 1; }
  h1 {
    text-shadow: 0 0 20px #c77dff;
    font-size: 2rem;
    animation: glow 5s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 12px #c77dff; }
    50%      { text-shadow: 0 0 32px #e0aaff, 0 0 60px #9d4edd; }
  }
  p { opacity: 0.8; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 420px;
    margin: 24px auto;
  }
  .card {
    padding: 18px 6px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(199,125,255,0.5);
    box-shadow: 0 0 14px rgba(199,125,255,0.35);
    font-size: 1.6rem;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: breathe 6s ease-in-out infinite;
  }
  .card:nth-child(even) { animation-delay: 3s; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 10px rgba(199,125,255,0.25); }
    50%      { box-shadow: 0 0 24px rgba(199,125,255,0.6); }
  }
  .card span { display: block; font-size: 0.8rem; margin-top: 6px; }
  .card:active { background: rgba(199,125,255,0.3); }

  #result {
    display: none;
    max-width: 420px;
    margin: 0 auto 24px;
    padding: 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(199,125,255,0.7);
    box-shadow: 0 0 24px rgba(199,125,255,0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #result h2 { margin: 0 0 4px; text-shadow: 0 0 14px #c77dff; }
  #date { font-size: 0.8rem; opacity: 0.7; margin: 0 0 12px; }
  .note { font-size: 0.7rem; opacity: 0.5; margin-top: 24px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>Daily Stars ✨</h1>
  <p>Choose your sign</p>

  <div id="result">
    <h2 id="signName"></h2>
    <p id="date"></p>
    <div id="message"></div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="note">For entertainment only.</p>

<script>
  var signs = [
    ["♈","Aries"],["♉","Taurus"],["♊","Gemini"],["♋","Cancer"],
    ["♌","Leo"],["♍","Virgo"],["♎","Libra"],["♏","Scorpio"],
    ["♐","Sagittarius"],["♑","Capricorn"],["♒","Aquarius"],["♓","Pisces"]
  ];

  var messages = [
    "A calm moment today brings a clear idea. Trust the first thing that feels right.",
    "Someone close is thinking of you. A small message could make their day.",
    "Slow down today. The answer you want arrives when you stop chasing it.",
    "A new door opens quietly. Say yes to something you would normally skip.",
    "Your energy is glowing. Use it to finish one thing you have been putting off.",
    "Listen more than you speak today. A useful secret is hiding in a conversation.",
    "Treat yourself kindly. Rest is part of your progress, not a pause from it.",
    "A small risk pays off today. Take the gentle step forward.",
    "Old worries fade. Something you feared turns out lighter than it looked.",
    "Creativity is strong today. Make something just for the joy of it."
  ];

  // drifting stars
  for (var n = 0; n < 28; n++) {
    var s = document.createElement("div");
    var size = 2 + Math.random() * 4;
    s.className = "star";
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (18 + Math.random() * 30) + "s, " + (3 + Math.random() * 5) + "s";
    s.style.animationDelay = (-Math.random() * 40) + "s, " + (-Math.random() * 6) + "s";
    document.body.appendChild(s);
  }

  var grid = document.getElementById("grid");
  signs.forEach(function (s, i) {
    var div = document.createElement("div");
    div.className = "card";
    div.innerHTML = s[0] + "<span>" + s[1] + "</span>";
    div.onclick = function () { show(i); };
    grid.appendChild(div);
  });

  function show(i) {
    var today = new Date();
    var start = new Date(today.getFullYear(), 0, 0);
    var dayNumber = Math.floor((today - start) / 86400000);
    var text = messages[(dayNumber + i * 3) % messages.length];

    document.getElementById("signName").textContent = signs[i][0] + " " + signs[i][1];
    document.getElementById("date").textContent = today.toDateString();
    document.getElementById("message").textContent = text;
    document.getElementById("result").style.display = "block";
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
