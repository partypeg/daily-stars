<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Stars</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0033, #3d0a6b, #0a1a4d);
    color: #f3e8ff;
    font-family: Georgia, serif;
    text-align: center;
    padding: 24px 16px;
  }
  h1 { text-shadow: 0 0 20px #c77dff; font-size: 2rem; }
  p { opacity: 0.8; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 420px;
    margin: 24px auto;
  }
  .card {
    padding: 18px 6px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(199,125,255,0.5);
    box-shadow: 0 0 14px rgba(199,125,255,0.35);
    font-size: 1.6rem;
  }
  .card span { display: block; font-size: 0.8rem; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Daily Stars ✨</h1>
  <p>Choose your sign</p>
  <div class="grid">
    <div class="card">♈<span>Aries</span></div>
    <div class="card">♉<span>Taurus</span></div>
    <div class="card">♊<span>Gemini</span></div>
    <div class="card">♋<span>Cancer</span></div>
    <div class="card">♌<span>Leo</span></div>
    <div class="card">♍<span>Virgo</span></div>
    <div class="card">♎<span>Libra</span></div>
    <div class="card">♏<span>Scorpio</span></div>
    <div class="card">♐<span>Sagittarius</span></div>
    <div class="card">♑<span>Capricorn</span></div>
    <div class="card">♒<span>Aquarius</span></div>
    <div class="card">♓<span>Pisces</span></div>
  </div>
</body>
</html>
